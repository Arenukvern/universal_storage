name: universal_storage_db
description: DB for flutter apps which uses universal_storage_sync as underlying storage.
version: 0.1.0-dev.12
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues
documentation: https://github.com/Arenukvern/universal_storage/tree/main/pkgs/universal_storage_db

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  from_json_to_json: ^0.5.0
  universal_storage_sync: ^0.1.0-dev.12
  xsoulspace_foundation: ^0.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  mockito: ^5.7.0
  xsoulspace_lints: ^0.1.2
