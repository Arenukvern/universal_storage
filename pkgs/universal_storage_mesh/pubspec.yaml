name: universal_storage_mesh
description: >-
  Serverless peer-to-peer storage provider for universal_storage_interface:
  QR pairing records, opportunistic sync sessions over a MeshTransport, and
  convergence via the shared kernel (ADR 0010).
version: 0.1.0-dev.1
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  cryptography: ^2.7.0
  meta: ^1.19.0
  universal_storage_chunks: ^0.1.0-dev.1
  universal_storage_convergence: ^0.1.0-dev.1
  universal_storage_convergence_session: ^0.1.0-dev.1
  universal_storage_interface: ^0.1.0-dev.12
  universal_storage_mesh_transport: ^0.1.0-dev.1
  universal_storage_world: ^0.1.0-dev.1
  web: ^1.1.0

dev_dependencies:
  lints: ^6.1.0
  qr: ^4.0.0
  test: ^1.26.2
  universal_storage_conformance:
    path: ../universal_storage_conformance
  xsoulspace_lints: ^0.1.2
