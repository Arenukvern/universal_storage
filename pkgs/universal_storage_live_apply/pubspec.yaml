name: universal_storage_live_apply
description: >
  Live-apply transaction layer for universal_storage providers: footprint
  journals, verified inverse replay, and rollback windows. Git-free by
  design — structural changes apply in place and stay undoable until commit.
version: 1.0.0
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues
documentation: https://github.com/Arenukvern/universal_storage/tree/main/pkgs/universal_storage_live_apply

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  crypto: ^3.0.7
  path: ^1.9.1
  universal_io: ^2.3.1
  universal_storage_interface: ^1.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.2
  universal_storage_filesystem: ^1.0.0
  xsoulspace_lints: ^0.1.2
