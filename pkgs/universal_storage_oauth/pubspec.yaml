name: universal_storage_oauth
description: >-
  Platform-agnostic OAuth contracts for Universal Storage: provider and
  flow-delegate interfaces, models, and credential storage. Platform
  implementations live in their own packages (e.g.
  universal_storage_github_oauth).
version: 1.0.0
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  from_json_to_json: ^0.6.0

dev_dependencies:
  build_runner: ^2.5.2
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  mockito: ^5.4.6
  xsoulspace_lints: ^0.1.2
