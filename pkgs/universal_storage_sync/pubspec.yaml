name: universal_storage_sync
description: |
  A cross-platform Dart package providing unified API for file
  storage operations with support for local filesystem and Git-based
  control.
version: 1.0.0
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues
documentation: https://github.com/Arenukvern/universal_storage/tree/main/pkgs/universal_storage_sync

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  from_json_to_json: ^0.6.0
  is_dart_empty_or_not: ^0.6.0
  meta: ^1.19.0
  synchronized: ^3.4.1
  universal_storage_interface: ^1.0.0
dev_dependencies:
  build_runner: ^2.15.2
  lints: ^6.1.0
  mockito: ^5.7.0
  test: ^1.31.2
  universal_storage_filesystem: ^1.0.0
  universal_storage_git_offline: ^1.0.0
  universal_storage_local_db: ^1.0.0
  universal_io: ^2.3.1
  xsoulspace_lints: ^0.1.2
  xsoulspace_foundation: ^0.4.0
