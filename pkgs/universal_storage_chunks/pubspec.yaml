name: universal_storage_chunks
description: >-
  Content-addressed chunk store for large binary members (ADR 0042):
  content-defined chunking, sha256 addressing, additive immutable stores,
  kernel-doc manifests, and chunk frames over a MeshSession. Pure Dart.
version: 0.1.0-dev.1
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  cryptography: ^2.7.0
  meta: ^1.19.0
  universal_storage_mesh_transport: ^0.1.0-dev.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.26.2
  universal_storage_conformance:
    path: ../universal_storage_conformance
  xsoulspace_lints: ^0.1.2
