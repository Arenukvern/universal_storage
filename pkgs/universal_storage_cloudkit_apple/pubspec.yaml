name: universal_storage_cloudkit_apple
description: iOS/macOS CloudKit native bridge for universal_storage_cloudkit.
version: 0.1.0-dev.1
license: MIT
homepage: https://github.com/Arenukvern/universal_storage
repository: https://github.com/Arenukvern/universal_storage
issue_tracker: https://github.com/Arenukvern/universal_storage/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  universal_storage_cloudkit_platform_interface: ^0.1.0-dev.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  pigeon: ^27.3.0
  xsoulspace_lints: ^0.1.2
flutter:
  plugin:
    platforms:
      ios:
        pluginClass: UniversalStorageCloudKitApplePlugin
      macos:
        pluginClass: UniversalStorageCloudKitApplePlugin
