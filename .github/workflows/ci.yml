name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: dart pub get
        run: dart pub get
      - name: dart analyze
        run: bash tool/ci/analyze_workspace.sh

  verify-git-consumer:
    runs-on: ubuntu-latest
    needs: analyze
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure git for dependency resolution
        run: |
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
      - name: verify git consumer resolution
        env:
          GIT_CONSUMER_REPO: https://github.com/${{ github.repository }}
        run: bash tool/ci/verify_git_consumer_resolution.sh

  test:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: dart pub get
        run: dart pub get
      - name: package tests
        run: bash tool/ci/test_packages.sh

  pub-dry-run:
    runs-on: ubuntu-latest
    needs: analyze
    strategy:
      matrix:
        package:
          - universal_storage_interface
          - universal_storage_sync
          - universal_storage_filesystem
          - universal_storage_live_apply
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: dart pub get
        run: dart pub get
      - name: dart pub publish --dry-run
        run: bash tool/release/publish_pub_package.sh --package-dir pkgs/${{ matrix.package }}
